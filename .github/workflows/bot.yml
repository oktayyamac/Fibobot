# Bu dosyayı reponda şu yola kaydet:  .github/workflows/bot.yml
name: fibo-bot

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"   # UTC; ABD seansını (kış/yaz saati) kapsar, bot seans dışını kendisi atlar
  workflow_dispatch:               # elle çalıştırmak için

permissions:
  contents: write                  # state.json'u geri kaydetmek için

concurrency:
  group: fibo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests yfinance pandas numpy

      - name: Sinyalleri tara ve gönder
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # SYMBOLS: "AAPL,MSFT,NVDA"   # istersen kendi listen
          # LEVELS: "0.5,0.618"         # istersen farklı seviyeler
          # LONG_ONLY: "1"              # sadece long sinyal için

      - name: Gönderilenleri kaydet
        run: |
          git config user.name "fibo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state" && git push)
